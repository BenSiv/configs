---
- name: Remove old manual Antigravity installation (cleanup)
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/antigravity
    - /usr/local/bin/antigravity

- name: Install Development Packages
  apt:
    name:
      - lua5.1
      - liblua5.1-0-dev
      - libsecret-1-0
      - libnotify4
      - libnss3
      - libxkbcommon0
      - libgbm1
      - libasound2t64
      - libgtk-3-0t64
      - luarocks
      - gcc
    state: present

- name: Install Lua Packages
  command:
    cmd: "luarocks install {{ item }}"
  register: luarocks_result
  changed_when: "'is already installed' not in luarocks_result.stderr and 'is already installed' not in luarocks_result.stdout"
  failed_when: 
    - luarocks_result.rc != 0
    - "'is already installed' not in luarocks_result.stderr"
    - "'is already installed' not in luarocks_result.stdout"
  loop:
    - luafilesystem
    - lua-yaml
    - dkjson

- name: Install Antigravity IDE snap
  community.general.snap:
    name: antigravity-ide-snap
    classic: yes
    state: present

- name: Check whether the Ollama service is installed
  stat:
    path: /etc/systemd/system/ollama.service
  register: ollama_service
  tags:
    - clean_slate

- name: Remove global AI CLI tools
  community.general.npm:
    name: "{{ item }}"
    global: yes
    state: absent
  loop:
    - "@google/gemini-cli"
    - "@openai/codex"
    - "@mariozechner/pi-coding-agent"
  tags:
    - clean_slate

- name: Remove Node.js and npm packages
  apt:
    name:
      - nodejs
      - npm
    state: absent
  tags:
    - clean_slate

- name: Stop and disable Ollama
  systemd:
    name: ollama
    state: stopped
    enabled: no
  when: ollama_service.stat.exists
  tags:
    - clean_slate

- name: Remove Ollama installation and model data
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/ollama.service
    - /etc/ollama
    - /usr/local/bin/ollama
    - /usr/share/ollama
    - /var/lib/ollama
    - /home/ollama
  tags:
    - clean_slate

- name: Remove Ollama system account
  user:
    name: ollama
    state: absent
    remove: yes
  tags:
    - clean_slate

- name: Reload systemd after removing Ollama
  systemd:
    daemon_reload: yes
  tags:
    - clean_slate

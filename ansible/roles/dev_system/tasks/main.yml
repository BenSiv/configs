---
- name: Remove old manual Antigravity installation (cleanup)
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/antigravity
    - /usr/local/bin/antigravity

- name: Install Development Packages
  apt:
    name:
      - lua5.1
      - liblua5.1-0-dev
      - libsecret-1-0
      - libnotify4
      - libnss3
      - libxkbcommon0
      - libgbm1
      - libasound2t64
      - libgtk-3-0t64
      - luarocks
      - gcc
    state: present

- name: Install Lua Packages
  command:
    cmd: "luarocks install {{ item }}"
  register: luarocks_result
  changed_when: "'is already installed' not in luarocks_result.stderr and 'is already installed' not in luarocks_result.stdout"
  failed_when: 
    - luarocks_result.rc != 0
    - "'is already installed' not in luarocks_result.stderr"
    - "'is already installed' not in luarocks_result.stdout"
  loop:
    - luafilesystem
    - lua-yaml
    - dkjson

- name: Install Antigravity IDE snap
  community.general.snap:
    name: antigravity-ide-snap
    classic: yes
    state: present

- name: Check if Ollama is installed
  command: which ollama
  register: ollama_check
  failed_when: false
  changed_when: false

- name: Install Ollama
  shell: curl -fsSL https://ollama.com/install.sh | sh
  when: ollama_check.rc != 0

- name: Install AI CLI tools globally via npm
  community.general.npm:
    name: "{{ item }}"
    global: yes
    state: present
  loop:
    - "@google/gemini-cli"
    - "@openai/codex"
    - "@mariozechner/pi-coding-agent"

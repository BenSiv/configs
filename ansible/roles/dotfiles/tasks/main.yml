---
- name: Configure Git Global
  git_config:
    name: "{{ item.key }}"
    scope: global
    value: "{{ item.value }}"
  loop:
    - { key: 'user.name', value: "BenSiv" }
    - { key: 'user.email', value: "bensiv92@gmail.com" }
    - { key: 'alias.tree', value: "log --graph --abbrev-commit --decorate --format=format:'%C(bold blue)%h%C(reset) - %C(bold cyan)%aD%C(reset) %C(bold green)(%ar)%C(reset)%C(bold yellow)%d%C(reset)%n'' %C(white)%s%C(reset) %C(dim white)- %an%C(reset)' --all" }
    - { key: 'alias.st', value: 'status' }
    - { key: 'alias.co', value: 'checkout' }
    - { key: 'init.defaultBranch', value: 'main' }
    - { key: 'push.default', value: 'current' }
    - { key: 'credential.helper', value: 'store' }
    - { key: 'core.editor', value: 'micro' }

- name: Create Projects directory
  file:
    path: "{{ user_home }}/Projects"
    state: directory
    owner: "{{ real_user }}"
    group: "{{ real_user }}"
    mode: '0755'

- name: Create Projects/external directory
  file:
    path: "{{ user_home }}/Projects/external"
    state: directory
    owner: "{{ real_user }}"
    group: "{{ real_user }}"
    mode: '0755'

- name: Clone Personal Repositories
  git:
    repo: "{{ item.repo }}"
    dest: "{{ user_home }}/Projects/{{ item.dest }}"
    recursive: yes
    update: no
  loop:
    - { repo: "https://github.com/BenSiv/configs.git", dest: "configs" }
    - { repo: "https://github.com/BenSiv/lua-automations.git", dest: "automations" }
    - { repo: "https://github.com/BenSiv/brain-ex.git", dest: "brain-ex" }
    - { repo: "https://github.com/BenSiv/luam.git", dest: "luam" }
    - { repo: "https://github.com/BenSiv/luametry.git", dest: "luametry" }
    - { repo: "https://github.com/BenSiv/daat.git", dest: "daat" }
    - { repo: "https://github.com/BenSiv/camopass.git", dest: "camopass" }

- name: Clone External Repositories
  git:
    repo: "{{ item }}"
    dest: "{{ user_home }}/Projects/external/{{ item | basename | splitext | first }}"
    recursive: yes
    update: no
  loop:
    - "https://github.com/elalish/manifold.git"

- name: Symlink Dotfiles
  file:
    src: "{{ user_home }}/Projects/configs/{{ item.src }}"
    dest: "{{ user_home }}/{{ item.dest }}"
    state: link
    force: yes
  loop:
    - { src: 'bash/bashrc.sh', dest: '.bashrc' }
    - { src: 'bash/bash_aliases.sh', dest: '.bash_aliases' }

- name: Configure Micro
  block:
    - name: Check Micro config status
      stat:
        path: "{{ user_home }}/.config/micro"
      register: micro_conf

    - name: Remove Micro config if it is a directory and not a symlink
      file:
        path: "{{ user_home }}/.config/micro"
        state: absent
      when: micro_conf.stat.exists and micro_conf.stat.isdir and not micro_conf.stat.islnk

    - name: Symlink Micro Config Directory
      file:
        src: "{{ user_home }}/Projects/configs/micro"
        dest: "{{ user_home }}/.config/micro"
        state: link
        force: yes

- name: Configure IDE User Settings
  block:
    - name: Create IDE Config Directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ real_user }}"
        group: "{{ real_user }}"
        mode: '0755'
      loop:
        - "{{ user_home }}/.config/Antigravity"
        - "{{ user_home }}/.config/Antigravity/User"
        - "{{ user_home }}/.config/Antigravity IDE"
        - "{{ user_home }}/.config/Antigravity IDE/User"
        - "{{ user_home }}/.antigravity"
        - "{{ user_home }}/.antigravity/extensions"
        - "{{ user_home }}/.antigravity-ide"
        - "{{ user_home }}/.antigravity-ide/extensions"

    - name: Check managed VS Code settings links
      stat:
        path: "{{ user_home }}/.config/Code/User/{{ item }}"
      loop:
        - settings.json
        - keybindings.json
      register: vscode_settings_links

    - name: Remove managed VS Code settings links
      file:
        path: "{{ item.stat.path }}"
        state: absent
      loop: "{{ vscode_settings_links.results }}"
      when: item.stat.islnk
      tags:
        - always
        - clean_slate

    - name: Symlink IDE Settings
      file:
        src: "{{ user_home }}/Projects/configs/vscode/{{ item.src }}"
        dest: "{{ user_home }}/{{ item.dest_dir }}/{{ item.dest_file }}"
        state: link
        owner: "{{ real_user }}"
        group: "{{ real_user }}"
        force: yes
      loop:
        - { dest_dir: ".config/Antigravity/User", src: 'settings.json', dest_file: 'settings.json' }
        - { dest_dir: ".config/Antigravity/User", src: 'keys.json', dest_file: 'keybindings.json' }
        - { dest_dir: ".config/Antigravity IDE/User", src: 'settings.json', dest_file: 'settings.json' }
        - { dest_dir: ".config/Antigravity IDE/User", src: 'keys.json', dest_file: 'keybindings.json' }

    - name: Symlink IDE Extensions
      file:
        src: "{{ user_home }}/Projects/luam/dev/vscode"
        dest: "{{ user_home }}/{{ item }}/luam-lang"
        state: link
        owner: "{{ real_user }}"
        group: "{{ real_user }}"
        force: yes
      loop:
        - ".antigravity/extensions"
        - ".antigravity-ide/extensions"

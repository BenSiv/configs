---
# Facts about what is already on the machine. Cleanup tasks in later roles
# use these so they only remove things that are actually installed.
- name: Gather installed apt packages
  package_facts:
    manager: apt
  tags:
    - always

- name: Wait for snapd to finish seeding
  command: snap wait system seed.loaded
  changed_when: false
  failed_when: false
  tags:
    - always

- name: List installed snaps
  command: snap list
  register: snap_list
  changed_when: false
  failed_when: false
  tags:
    - always

- name: Check for npm
  shell: command -v npm
  register: npm_check
  changed_when: false
  failed_when: false
  tags:
    - always

- name: Record installed snaps and npm presence
  set_fact:
    installed_snaps: "{{ (snap_list.stdout_lines | default([]))[1:] | map('split') | map('first') | list }}"
    npm_installed: "{{ npm_check.rc == 0 }}"
  tags:
    - always

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install common packages
  apt:
    name:
      - curl
      - wget
      - git
      - make
      - fd-find
      - ripgrep
      - jq
      - tree
      - micro
      - sqlite3
      - pandoc
      - texlive-xetex
      - build-essential
      - pass
      - gnupg
      - cmake
      - libreadline-dev
      - libsqlite3-dev
      - podman
      - keepassxc-full
      - vlc
    state: present

- name: Install Quarto
  block:
    - name: Download Quarto deb package
      get_url:
        url: "https://github.com/quarto-dev/quarto-cli/releases/download/v1.4.550/quarto-1.4.550-linux-amd64.deb"
        dest: "/tmp/quarto-1.4.550-linux-amd64.deb"
        mode: '0644'

    - name: Install Quarto package using apt
      apt:
        deb: "/tmp/quarto-1.4.550-linux-amd64.deb"
        state: present

    - name: Clean up Quarto deb package
      file:
        path: "/tmp/quarto-1.4.550-linux-amd64.deb"
        state: absent

- name: Install Google Chrome
  block:
    - name: Download Google Chrome .deb
      get_url:
        url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        dest: /tmp/google-chrome-stable_current_amd64.deb

    - name: Install Google Chrome
      apt:
        deb: /tmp/google-chrome-stable_current_amd64.deb

- name: Create symlink for fd
  file:
    src: /usr/bin/fdfind
    dest: /usr/bin/fd
    state: link
    force: yes
  ignore_errors: yes

- name: Set timezone to America/Los_Angeles
  timezone:
    name: "America/Los_Angeles"

- name: Generate en_US.UTF-8 locale
  locale_gen:
    name: en_US.UTF-8
    state: present

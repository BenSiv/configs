---
- name: Remove GIMP Snap in favor of the Ubuntu package
  community.general.snap:
    name: gimp
    state: absent
  when: "'gimp' in installed_snaps"

- name: Install GNOME Tools
  apt:
    name:
      - ubuntu-desktop-minimal
      - gnome-tweaks
      - dconf-cli
      - pipx
      - gnome-shell-extension-manager
      - gimp
    state: present

- name: Remove Bloatware
  apt:
    name: "{{ bloatware | select('in', ansible_facts.packages) | list }}"
    state: absent
    purge: yes
  when: bloatware | select('in', ansible_facts.packages) | list | length > 0
  vars:
    bloatware:
      - aisleriot
      - gnome-mahjongg
      - gnome-mines
      - firefox
      - gnome-sudoku
      - libreoffice-core
      - libreoffice-common
      - libreoffice-calc
      - libreoffice-draw
      - libreoffice-gnome
      - libreoffice-gtk3
      - libreoffice-impress
      - libreoffice-math
      - libreoffice-writer
      - rhythmbox
      - shotwell
      - thunderbird
      - transmission-common
      - transmission-gtk
      - remmina

- name: Remove Firefox snap
  community.general.snap:
    name: firefox
    state: absent
  when: "'firefox' in installed_snaps"

- name: Remove standalone VS Code snap
  community.general.snap:
    name: code
    state: absent
  when: "'code' in installed_snaps"
  tags:
    - always
    - clean_slate

- name: Install Classic Desktop Applications via Snap
  community.general.snap:
    name: "{{ item }}"
    classic: yes
    state: present
  loop:
    - android-studio

- name: Install Zen Browser via Snap
  community.general.snap:
    name: zen-browser-snap
    channel: candidate
    state: present

- name: Install Standard Desktop Applications via Snap
  community.general.snap:
    name: "{{ item }}"
    state: present
  loop:
    - onlyoffice-desktopeditors
    - paint
    - whatsapp-linux-app
